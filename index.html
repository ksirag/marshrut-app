<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121b26">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Маршрут">
  <meta name="description" content="Журнал пробежек и прогулок с картой и GPS.">
  <title>Маршрут</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="vendor/leaflet.js"></script>
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <div class="app">
    <header class="top" id="top">
      <a class="brand" href="#today"><svg aria-hidden="true"><use href="icons.svg#mark"/></svg><span>Маршрут</span></a>
      <a href="#settings" class="icon-button" aria-label="Настройки"><svg aria-hidden="true"><use href="icons.svg#settings"/></svg></a>
    </header>
    <main id="content" tabindex="-1">
      <noscript><p class="empty">Включите JavaScript, чтобы открыть журнал и карту.</p></noscript>
    </main>
    <nav class="tabs" aria-label="Разделы">
      <a href="#today" data-tab="today" aria-current="page"><svg aria-hidden="true"><use href="icons.svg#shoe"/></svg>Сегодня</a>
      <a href="#stats" data-tab="stats"><svg aria-hidden="true"><use href="icons.svg#chart"/></svg>Статистика</a>
      <a href="#gps" data-tab="gps" id="gps-tab"><svg aria-hidden="true"><use href="icons.svg#gps"/></svg>GPS</a>
      <a href="#journal" data-tab="journal"><svg aria-hidden="true"><use href="icons.svg#journal"/></svg>Журнал</a>
    </nav>
  </div>
  <div id="notice" role="status" hidden></div>
</body>
</html>
